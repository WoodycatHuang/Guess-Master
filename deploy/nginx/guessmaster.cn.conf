# guessmaster.cn — H5 静态站点（SPA）
# 安装：sudo cp deploy/nginx/guessmaster.cn.conf /etc/nginx/sites-available/
#       sudo ln -sf /etc/nginx/sites-available/guessmaster.cn.conf /etc/nginx/sites-enabled/
# 证书：sudo certbot --nginx -d guessmaster.cn -d www.guessmaster.cn

server {
    listen 80;
    listen [::]:80;
    server_name guessmaster.cn www.guessmaster.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name guessmaster.cn www.guessmaster.cn;

    # certbot 生成后路径（按实际证书名调整）
    ssl_certificate     /etc/letsencrypt/live/guessmaster.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guessmaster.cn/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/guessmaster;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json text/plain;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
