# api.guessmaster.cn — 联机 API + WebSocket 反代
# 前置：http { } 内 include guess-master-ws-map.conf
# 安装：sudo cp deploy/nginx/api.guessmaster.cn.conf /etc/nginx/sites-available/
#       sudo ln -sf /etc/nginx/sites-available/api.guessmaster.cn.conf /etc/nginx/sites-enabled/
# 证书：sudo certbot --nginx -d api.guessmaster.cn

upstream guess_master_sync {
    server 127.0.0.1:8787;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.guessmaster.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.guessmaster.cn;

    ssl_certificate     /etc/letsencrypt/live/api.guessmaster.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.guessmaster.cn/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://guess_master_sync;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout    86400s;
        proxy_read_timeout    86400s;
    }
}
